name: Bindgen
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  bindgen:
    name: Bindgen on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Rust toolchain
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Delete old generated bindings
        run: rm -rf ndi/src/internal/*.rs
        shell: bash

      - name: Generate bindings
        run: cargo xtask bindgen

      - name: Upload generated bindings
        uses: actions/upload-artifact@v3
        with:
          name: internal-rs-files
          path: ndi/src/internal/*.rs
