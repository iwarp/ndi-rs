name: Bindgen
on:
  push:
jobs:
  bindgen:
    name: Bindgen on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Delete old generated bindings
        run: rm -rf ndi/src/internal/*.rs
        shell: bash

      - name: Generate bindings
        run: cargo xtask bindgen

      - name: Upload generated bindings
        uses: actions/upload-artifact@v4
        with:
          name: bindgen-${{ matrix.os }}
          path: ndi/src/internal/*.rs
